- name: Upload a Build Artifact
  uses: actions/upload-artifact@v7.0.1
  with:
    # artifact 名称（页面上显示的名字）
    name: voxy-artifacts

    # 要上传的文件/目录，支持通配符
    path: build/libs/*.jar

    # 没找到文件时：warn=警告不失败，error=直接失败，ignore=静默忽略
    if-no-files-found: error

    # 保留天数（1–90，0=用仓库默认）
    retention-days: 30

    # 压缩级别：0=不压缩（快），6=默认，9=最高压缩（慢）
    compression-level: 6

    # 是否覆盖已存在的同名 artifact
    overwrite: true

    # 是否包含隐藏文件（.开头的文件）
    include-hidden-files: false

    # 是否打包成 zip：true=打包，false=直接传单个文件（v7 新功能）
    archive: true
